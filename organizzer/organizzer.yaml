apiVersion: v1
kind: Namespace
metadata:
  name: organizzer
  labels:
    app.kubernetes.io/name: organizzer
    app.kubernetes.io/instance: organizzer
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
---
# Source: organizzer/templates/deployments.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: organizzer-asylguiden-request
  namespace: organizzer
  labels:
    app.kubernetes.io/name: organizzer
    app.kubernetes.io/instance: organizzer
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: request
    organizzer.goodtribes.org/board: asylguiden
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: organizzer
      app.kubernetes.io/instance: organizzer
      app.kubernetes.io/component: request
      organizzer.goodtribes.org/board: asylguiden
  template:
    metadata:
      labels:
        app.kubernetes.io/name: organizzer
        app.kubernetes.io/instance: organizzer
        app.kubernetes.io/component: request
        organizzer.goodtribes.org/board: asylguiden
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # Without this the pod only satisfies "baseline", and a namespace that
        # enforces the restricted profile rejects it outright rather than
        # warning as this cluster does.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: organizzer
          image: "ghcr.io/goodtribes-org/agent/organizzer:6eb2489e9e9e5c027737184ec03707666b5c798f"
          imagePullPolicy: IfNotPresent
          command: ["organizzer", "request"]
          ports:
            - name: health
              containerPort: 8080
          env:
            - name: GITHUB_ORG
              value: "goodtribes-org"
            - name: POLL_BUSY_SECONDS
              value: "10"
            - name: POLL_IDLE_SECONDS
              value: "60"
            - name: BERGET_BASE_URL
              value: "https://api.berget.ai/v1"
            - name: BERGET_TIMEOUT_SECONDS
              value: "900"
            - name: LLM_TEMPERATURE
              value: "0.1"
            - name: LLM_MAX_ATTEMPTS
              value: "3"
            - name: MAX_ISSUES_PER_HOUR
              value: "10"
            - name: KUBEFOUNDRY_WEBHOOK_URL
              value: "http://kube-foundry-webhook.kubefoundry.svc.cluster.local"
            - name: KUBEFOUNDRY_WEBHOOK_PATH
              value: "/api/v1/tasks"
            - name: FOUNDRY_AGENT
              value: "open-code"
            - name: FOUNDRY_SKILLS
              value: "berget"
            - name: FOUNDRY_SECRET_REF
              value: "factory-creds-goodtribes"
            - name: FOUNDRY_BRANCH
              value: "main"
            - name: FOUNDRY_MAX_RETRIES
              value: "1"
            - name: FOUNDRY_GIT_AUTHOR_NAME
              value: "organizzer"
            - name: FOUNDRY_GIT_AUTHOR_EMAIL
              value: "organizzer@goodtribes.org"
            - name: LOG_LEVEL
              value: "info"
            - name: PROJECT_NUMBER
              value: "4"
            - name: ALLOWED_REPOS
              value: "asylguiden.se"
            - name: MODEL_REQUEST
              value: "mistralai/Mistral-Small-3.2-24B-Instruct-2506"
          envFrom:
            - secretRef:
                name: organizzer-secret
          # There is no request traffic to serve, so readiness reports whether
          # the poll loop is still turning. A stage wedged on something it
          # cannot see stops ticking and shows up here rather than looking
          # healthy while doing nothing.
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
