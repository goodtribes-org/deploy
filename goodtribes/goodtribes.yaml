apiVersion: batch/v1
kind: Job
metadata:
  name: goodtribes-minio-init
  namespace: goodtribes
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: goodtribes
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: minio-init
          image: minio/mc:latest
          securityContext:
            allowPrivilegeEscalation: false
          command:
            - /bin/sh
            - -c
            - |
              mc alias set local http://goodtribes-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing local/goodtribes-public
              mc mb --ignore-existing local/goodtribes-private
              mc mb --ignore-existing local/goodtribes-backups
              mc mb --ignore-existing local/goodtribes-object-backups
              mc anonymous set public local/goodtribes-public
          envFrom:
            - secretRef:
                name: goodtribes-secret
