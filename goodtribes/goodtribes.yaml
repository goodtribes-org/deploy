apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: goodtribes-ingress
  namespace: goodtribes
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: goodtribes
  annotations:
    acme.cert-manager.io/http01-edit-in-place: "true"
    cert-manager.io/cluster-issuer: http
    kubernetes.io/ingress.class: traefik
    kubernetes.io/tls-acme: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure,web
spec:
  ingressClassName: traefik
  rules:
    - host: goodtribes.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: goodtribes-frontend
                port:
                  number: 3000
    - host: www.goodtribes.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: goodtribes-frontend
                port:
                  number: 3000
  tls:
    - hosts:
      - goodtribes.org
      - www.goodtribes.org
      secretName: goodtribes-tls
