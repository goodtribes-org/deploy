# Source: goodtribes/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: goodtribes-ingress
  namespace: goodtribes
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: goodtribes
  annotations:
    acme.cert-manager.io/http01-edit-in-place: "true"
    cert-manager.io/cluster-issuer: http
    kubernetes.io/ingress.class: traefik
    kubernetes.io/tls-acme: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure,web
spec:
  ingressClassName: traefik
  rules:
    - host: goodtribes.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: goodtribes-frontend
                port:
                  number: 3000
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: goodtribes-backend
                port:
                  number: 1337
    - host: www.goodtribes.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: goodtribes-frontend
                port:
                  number: 3000
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: goodtribes-backend
                port:
                  number: 1337
  tls:
    - hosts:
      - goodtribes.org
      - www.goodtribes.org
      secretName: goodtribes-tls
---
# Source: goodtribes/templates/minio-init-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: goodtribes-minio-init
  namespace: goodtribes
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: goodtribes
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-init
          image: minio/mc:latest
          command:
            - /bin/sh
            - -c
            - |
              mc alias set local http://goodtribes-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing local/goodtribes-public
              mc mb --ignore-existing local/goodtribes-private
              mc anonymous set public local/goodtribes-public
          envFrom:
            - secretRef:
                name: goodtribes-secret
