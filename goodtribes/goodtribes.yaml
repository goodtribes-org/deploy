apiVersion: apps/v1
kind: Deployment
metadata:
  name: goodtribes-meilisearch
  namespace: goodtribes
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: goodtribes
    app.kubernetes.io/name: meilisearch
spec:
  replicas: 1
  # See the comment on the postgres Deployment's strategy — same reasoning:
  # a single ReadWriteOnce PVC can't be mounted by an old and new pod at
  # once, so Recreate is the correct choice, not an oversight.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: meilisearch
      app.kubernetes.io/part-of: goodtribes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meilisearch
        app.kubernetes.io/part-of: goodtribes
    spec:
      containers:
        - name: meilisearch
          image: "getmeili/meilisearch:v1.6"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7700
              protocol: TCP
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
          envFrom:
            - secretRef:
                name: goodtribes-secret
          env:
            - name: MEILI_ENV
              value: "production"
          volumeMounts:
            - name: meili-data
              mountPath: /meili_data
          readinessProbe:
            httpGet:
              path: /health
              port: 7700
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 7700
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: meili-data
          persistentVolumeClaim:
            claimName: goodtribes-meilisearch
