# Source: goodtribes/templates/postgres-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goodtribes-postgres
  namespace: goodtribes
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: goodtribes
    app.kubernetes.io/name: postgres
spec:
  replicas: 1
  # Recreate, not RollingUpdate, is intentional here: a single replica with a
  # ReadWriteOnce PVC can't have an old and new pod both mount the volume at
  # once, so a rolling update would just fail to schedule the new pod anyway.
  # Recreate makes the resulting brief outage on every rollout explicit
  # instead of surfacing as a confusing stuck deployment.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: goodtribes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: goodtribes
    spec:
      containers:
        - name: postgres
          image: "postgres:16-alpine"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              protocol: TCP
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
          envFrom:
            - secretRef:
                name: goodtribes-secret
          env:
            - name: POSTGRES_DB
              value: "goodtribes"
            - name: POSTGRES_USER
              value: "goodtribes"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: data
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - goodtribes
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - goodtribes
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: goodtribes-postgres
