        - name: backend
          image: "ghcr.io/goodtribes-org/goodtribes.org/backend:5468fd6e70cbc76e7400e05de0482512984d984c"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1337
              protocol: TCP
          envFrom:
            - secretRef:
                name: goodtribes-secret
          env:
            - name: DATABASE_CLIENT
              value: "postgres"
            - name: DATABASE_HOST
              value: "goodtribes-postgres"
