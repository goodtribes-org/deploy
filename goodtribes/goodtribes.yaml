      containers:
        - name: frontend
          image: "ghcr.io/goodtribes-org/goodtribes.org/frontend:120d9d54be180b32e60bd82afc56937e1a00f5e8"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: goodtribes-secret
          env:
            - name: DATABASE_CONNECTION_LIMIT
              value: "10"
            - name: NEXT_PUBLIC_MEILI_HOST
              value: "http://goodtribes-meilisearch:7700"
            - name: NEXT_PUBLIC_STORAGE_URL
              value: "https://goodtribes.org/storage"
            - name: S3_ENDPOINT
              value: "http://goodtribes-minio:9000"
            - name: S3_PRIVATE_BUCKET
              value: "goodtribes-private"
            - name: S3_PUBLIC_BUCKET
              value: "goodtribes-public"
          # EMERGENCY REVERT 2026-08-23: readiness was pointed at /api/health
          # (DB+Redis check) for one deploy cycle. That makes ALL frontend
          # pods NotReady whenever DB/Redis is unreachable for any reason,
          # which drops the Service to zero endpoints and makes Traefik
          # return its generic "no route" 404 for every path — indistinguishable
          # from a routing outage from the outside, and it happened right
          # after this went live. Reverted to "/" (plain process-alive check)
          # to restore traffic while the actual DB/Redis reachability issue
          # is root-caused with real cluster access. Re-apply the DB+Redis
          # readiness check once that's confirmed fixed — see CLAUDE.md.
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
