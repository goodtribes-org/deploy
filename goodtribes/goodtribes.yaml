# Source: goodtribes/templates/meilisearch-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goodtribes-meilisearch
  namespace: goodtribes
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: goodtribes
    app.kubernetes.io/name: meilisearch
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: meilisearch
      app.kubernetes.io/part-of: goodtribes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meilisearch
        app.kubernetes.io/part-of: goodtribes
    spec:
      containers:
        - name: meilisearch
          image: "getmeili/meilisearch:v1.6"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7700
              protocol: TCP
          envFrom:
            - secretRef:
                name: goodtribes-secret
          env:
            - name: MEILI_ENV
              value: "production"
          volumeMounts:
            - name: meili-data
              mountPath: /meili_data
          readinessProbe:
            httpGet:
              path: /health
              port: 7700
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 7700
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: meili-data
          persistentVolumeClaim:
            claimName: goodtribes-meilisearch
