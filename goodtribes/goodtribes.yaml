# Source: goodtribes/templates/github-sync-cronjob.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: goodtribes-github-sync
  namespace: goodtribes
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: goodtribes
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/part-of: goodtribes
        spec:
          restartPolicy: OnFailure
          containers:
            - name: github-sync
              image: "curlimages/curl:8.11.1"
              command:
                - /bin/sh
                - -c
                - |
                  curl -sfS --max-time 240 -X POST \
                    -H "Authorization: Bearer $CRON_SECRET" \
                    -H "Content-Type: application/json" \
                    http://goodtribes-frontend:3000/api/cron/github-sync
              envFrom:
                - secretRef:
                    name: goodtribes-secret
