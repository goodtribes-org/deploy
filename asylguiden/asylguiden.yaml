# Source: asylguiden/templates/meilisearch-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asylguiden-meilisearch
  namespace: asylguiden
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: asylguiden
    app.kubernetes.io/name: meilisearch
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: meilisearch
      app.kubernetes.io/part-of: asylguiden
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meilisearch
        app.kubernetes.io/part-of: asylguiden
    spec:
      containers:
        - name: meilisearch
          image: "getmeili/meilisearch:v1.6"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7700
              protocol: TCP
          envFrom:
            - secretRef:
                name: asylguiden-secret
          env:
            - name: MEILI_ENV
              value: "production"
          volumeMounts:
            - name: meili-data
              mountPath: /meili_data
          readinessProbe:
            httpGet:
              path: /health
              port: 7700
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 7700
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: meili-data
          persistentVolumeClaim:
            claimName: asylguiden-meilisearch
---
# Source: asylguiden/templates/postgres-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asylguiden-postgres
  namespace: asylguiden
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: asylguiden
    app.kubernetes.io/name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: asylguiden
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: asylguiden
    spec:
      containers:
        - name: postgres
          image: "postgres:16-alpine"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              protocol: TCP
          envFrom:
            - secretRef:
                name: asylguiden-secret
          env:
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: data
            - name: init-db
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - asylguiden
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - asylguiden
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: asylguiden-postgres
        - name: init-db
          configMap:
            name: asylguiden-init-db
