# Source: asylguiden/templates/backend-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asylguiden-backend
  namespace: asylguiden
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: asylguiden
    app.kubernetes.io/name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/part-of: asylguiden
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: asylguiden
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: backend
          image: "ghcr.io/goodtribes-org/asylguiden.se/backend:df3527dba178ddb244427664a1a2a379f9b007e0"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1337
              protocol: TCP
          envFrom:
            - secretRef:
                name: asylguiden-secret
          env:
            - name: CORS_ORIGINS
              value: "https://asylguiden.se,https://www.asylguiden.se"
            - name: DATABASE_CLIENT
              value: "postgres"
            - name: DATABASE_HOST
              value: "asylguiden-postgres"
            - name: DATABASE_NAME
              value: "asylguiden"
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_SSL
              value: "false"
            - name: HOST
              value: "0.0.0.0"
            - name: MEILI_HOST
              value: "http://asylguiden-meilisearch:7700"
            - name: PORT
              value: "1337"
            - name: PUBLIC_URL
              value: "https://content.asylguiden.se"
          readinessProbe:
            httpGet:
              path: /_health
              port: 1337
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_health
              port: 1337
            initialDelaySeconds: 30
            periodSeconds: 30
