# Source: asylguiden/templates/collector-cronjob.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: asylguiden-collector-eurostat
  namespace: asylguiden
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: asylguiden
    app.kubernetes.io/name: collector
    app.kubernetes.io/component: eurostat
spec:
  schedule: "0 8 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: collector
            app.kubernetes.io/part-of: asylguiden
            app.kubernetes.io/component: eurostat
        spec:
          imagePullSecrets:
            - name: ghcr-pull-secret
          restartPolicy: OnFailure
          containers:
            - name: collector
              image: "ghcr.io/goodtribes-org/asylguiden.se/collector:df3527dba178ddb244427664a1a2a379f9b007e0"
              imagePullPolicy: IfNotPresent
              args: ["--once", "--collector=eurostat"]
              env:
                - name: STRAPI_URL
                  value: "http://asylguiden-backend:1337"
                - name: LOG_LEVEL
                  value: "info"
                - name: STRAPI_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: asylguiden-secret
                      key: COLLECTOR_STRAPI_API_TOKEN
