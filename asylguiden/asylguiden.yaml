# Source: asylguiden/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: asylguiden-ingress
  namespace: asylguiden
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: asylguiden
  annotations:
    cert-manager.io/cluster-issuer: http
    kubernetes.io/ingress.class: traefik
    kubernetes.io/tls-acme: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure,web
spec:
  ingressClassName: traefik
  tls:
    - secretName: asylguiden-tls
      hosts:
        - "asylguiden.se"
        - "www.asylguiden.se"
    - secretName: asylguiden-cms-tls
      hosts:
        - "content.asylguiden.se"
  rules:
    - host: "asylguiden.se"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: asylguiden-frontend
                port:
                  number: 3000
    - host: "www.asylguiden.se"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: asylguiden-frontend
                port:
                  number: 3000
    - host: "content.asylguiden.se"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: asylguiden-backend
                port:
                  number: 1337
