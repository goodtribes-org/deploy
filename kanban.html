<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Board</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-2: #22253a;
      --border: #2e3150;
      --accent: #5b6af0;
      --accent-hover: #7080f5;
      --text: #e4e6f0;
      --text-muted: #8890b0;
      --card-bg: #252840;
      --card-hover: #2d3158;
      --danger: #e05c6a;
      --planned: #6c7ae0;
      --todo: #e0a23a;
      --inprogress: #3ab8e0;
      --review: #b06ce0;
      --done: #3ac47d;
      --shadow: 0 2px 8px rgba(0,0,0,0.4);
      --radius: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px 28px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    header h1 span {
      color: var(--accent);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-input {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 14px;
      font-size: 0.875rem;
      outline: none;
      width: 220px;
      transition: border-color 0.15s;
    }

    .search-input::placeholder { color: var(--text-muted); }
    .search-input:focus { border-color: var(--accent); }

    .board {
      flex: 1;
      display: flex;
      gap: 14px;
      padding: 24px;
      overflow-x: auto;
      align-items: flex-start;
    }

    .column {
      flex: 0 0 280px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .column-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      user-select: none;
    }

    .column-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .column-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .column[data-col="planned"] .column-dot   { background: var(--planned); }
    .column[data-col="todo"] .column-dot       { background: var(--todo); }
    .column[data-col="inprogress"] .column-dot { background: var(--inprogress); }
    .column[data-col="review"] .column-dot     { background: var(--review); }
    .column[data-col="done"] .column-dot       { background: var(--done); }

    .column[data-col="planned"] .column-label   { color: var(--planned); }
    .column[data-col="todo"] .column-label       { color: var(--todo); }
    .column[data-col="inprogress"] .column-label { color: var(--inprogress); }
    .column[data-col="review"] .column-label     { color: var(--review); }
    .column[data-col="done"] .column-label       { color: var(--done); }

    .column-count {
      background: var(--surface-2);
      border-radius: 12px;
      padding: 1px 8px;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 60px;
      border-radius: var(--radius);
      transition: background 0.15s;
      padding: 2px;
    }

    .cards-list.drag-over {
      background: rgba(91, 106, 240, 0.08);
      outline: 2px dashed var(--accent);
      outline-offset: -2px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      cursor: grab;
      box-shadow: var(--shadow);
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      position: relative;
      word-break: break-word;
    }

    .card:hover { background: var(--card-hover); box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
    .card.dragging { opacity: 0.4; cursor: grabbing; transform: scale(0.97); }
    .card.highlight { outline: 2px solid var(--accent); }

    .card-title {
      font-size: 0.9rem;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .card-tags {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(91, 106, 240, 0.18);
      color: var(--accent-hover);
      text-transform: lowercase;
    }

    .card-actions {
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .card:hover .card-actions { opacity: 1; }

    .btn-icon {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 26px;
      height: 26px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      transition: background 0.15s, color 0.15s;
    }

    .btn-icon:hover { background: var(--border); color: var(--text); }
    .btn-icon.danger:hover { background: var(--danger); color: #fff; border-color: var(--danger); }

    .add-card-btn {
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--text-muted);
      border-radius: var(--radius);
      padding: 10px;
      cursor: pointer;
      font-size: 0.83rem;
      width: 100%;
      text-align: left;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .add-card-btn:hover {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--accent);
    }

    /* Modal */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
      backdrop-filter: blur(3px);
    }

    .overlay.hidden { display: none; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    }

    .modal h2 {
      font-size: 1.1rem;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 5px;
      font-weight: 500;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 9px 12px;
      font-size: 0.875rem;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
      resize: vertical;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus { border-color: var(--accent); }

    .form-group select option { background: var(--surface-2); }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      padding: 9px 20px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }
    .btn-secondary:hover { color: var(--text); background: var(--border); }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 24px 12px;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .empty-state svg { margin-bottom: 8px; opacity: 0.4; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  </style>
</head>
<body>

<header>
  <h1>Kanban <span>Board</span></h1>
  <div class="header-actions">
    <input class="search-input" type="search" id="search" placeholder="Search cards..." autocomplete="off" />
  </div>
</header>

<main class="board" id="board">
  <!-- Columns rendered by JS -->
</main>

<!-- Card Modal -->
<div class="overlay hidden" id="overlay" role="dialog" aria-modal="true">
  <div class="modal">
    <h2 id="modal-title">Add Card</h2>
    <form id="card-form" autocomplete="off">
      <div class="form-group">
        <label for="f-title">Title *</label>
        <input id="f-title" type="text" placeholder="What needs to be done?" required />
      </div>
      <div class="form-group">
        <label for="f-desc">Description</label>
        <textarea id="f-desc" rows="3" placeholder="Optional details…"></textarea>
      </div>
      <div class="form-group">
        <label for="f-tags">Tags <span style="color:var(--text-muted);font-weight:400">(comma-separated)</span></label>
        <input id="f-tags" type="text" placeholder="e.g. bug, frontend, urgent" />
      </div>
      <div class="form-group">
        <label for="f-col">Column</label>
        <select id="f-col"></select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="modal-submit">Add Card</button>
      </div>
    </form>
  </div>
</div>

<script>
  const COLUMNS = [
    { id: 'planned',    label: 'Planned' },
    { id: 'todo',       label: 'To Do' },
    { id: 'inprogress', label: 'In Progress' },
    { id: 'review',     label: 'Review' },
    { id: 'done',       label: 'Done' },
  ];

  const STORAGE_KEY = 'kanban_cards_v1';

  let cards = loadCards();
  let dragId = null;
  let editId = null;

  function loadCards() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch { return []; }
  }

  function saveCards() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  // ── Render ──────────────────────────────────────────────────

  function getFilteredCards() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    if (!q) return cards;
    return cards.map(c => ({
      ...c,
      _hidden: !(
        c.title.toLowerCase().includes(q) ||
        (c.desc || '').toLowerCase().includes(q) ||
        (c.tags || []).some(t => t.toLowerCase().includes(q))
      )
    }));
  }

  function renderBoard() {
    const board = document.getElementById('board');
    const filtered = getFilteredCards();
    board.innerHTML = '';

    COLUMNS.forEach(col => {
      const colCards = filtered.filter(c => c.col === col.id);
      const visibleCount = colCards.filter(c => !c._hidden).length;

      const colEl = document.createElement('div');
      colEl.className = 'column';
      colEl.dataset.col = col.id;

      colEl.innerHTML = `
        <div class="column-header">
          <div class="column-label">
            <span class="column-dot"></span>
            ${col.label}
          </div>
          <span class="column-count">${visibleCount}</span>
        </div>
        <div class="cards-list" data-col="${col.id}"></div>
        <button class="add-card-btn" data-col="${col.id}">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add card
        </button>
      `;

      const list = colEl.querySelector('.cards-list');

      colCards.forEach(card => {
        if (card._hidden) return;
        const cardEl = createCardEl(card);
        list.appendChild(cardEl);
      });

      if (colCards.filter(c => !c._hidden).length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="3"/>
              <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
            <div>No cards yet</div>
          </div>`;
      }

      // Drag events on list
      list.addEventListener('dragover', e => {
        e.preventDefault();
        list.classList.add('drag-over');
      });
      list.addEventListener('dragleave', e => {
        if (!list.contains(e.relatedTarget)) list.classList.remove('drag-over');
      });
      list.addEventListener('drop', e => {
        e.preventDefault();
        list.classList.remove('drag-over');
        if (!dragId) return;
        const card = cards.find(c => c.id === dragId);
        if (card && card.col !== col.id) {
          card.col = col.id;
          saveCards();
          renderBoard();
        }
      });

      board.appendChild(colEl);
    });

    // Add-card buttons
    board.querySelectorAll('.add-card-btn').forEach(btn => {
      btn.addEventListener('click', () => openModal(null, btn.dataset.col));
    });
  }

  function createCardEl(card) {
    const el = document.createElement('div');
    el.className = 'card';
    el.draggable = true;
    el.dataset.id = card.id;

    const tags = (card.tags || [])
      .map(t => `<span class="tag">${escHtml(t)}</span>`)
      .join('');

    el.innerHTML = `
      <div class="card-title">${escHtml(card.title)}</div>
      ${card.desc ? `<div class="card-desc">${escHtml(card.desc)}</div>` : ''}
      <div class="card-meta">
        <div class="card-tags">${tags}</div>
        <div class="card-actions">
          <button class="btn-icon" title="Edit" data-action="edit">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="btn-icon danger" title="Delete" data-action="delete">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div>
      </div>
    `;

    el.addEventListener('dragstart', () => {
      dragId = card.id;
      el.classList.add('dragging');
    });
    el.addEventListener('dragend', () => {
      dragId = null;
      el.classList.remove('dragging');
    });

    el.querySelector('[data-action="edit"]').addEventListener('click', e => {
      e.stopPropagation();
      openModal(card.id, card.col);
    });

    el.querySelector('[data-action="delete"]').addEventListener('click', e => {
      e.stopPropagation();
      deleteCard(card.id);
    });

    return el;
  }

  function deleteCard(id) {
    cards = cards.filter(c => c.id !== id);
    saveCards();
    renderBoard();
  }

  // ── Modal ───────────────────────────────────────────────────

  function populateColSelect(selectedCol) {
    const sel = document.getElementById('f-col');
    sel.innerHTML = COLUMNS.map(c =>
      `<option value="${c.id}"${c.id === selectedCol ? ' selected' : ''}>${c.label}</option>`
    ).join('');
  }

  function openModal(cardId, defaultCol) {
    editId = cardId || null;
    const overlay = document.getElementById('overlay');
    const title = document.getElementById('modal-title');
    const submitBtn = document.getElementById('modal-submit');

    if (cardId) {
      const card = cards.find(c => c.id === cardId);
      document.getElementById('f-title').value = card.title;
      document.getElementById('f-desc').value = card.desc || '';
      document.getElementById('f-tags').value = (card.tags || []).join(', ');
      populateColSelect(card.col);
      title.textContent = 'Edit Card';
      submitBtn.textContent = 'Save Changes';
    } else {
      document.getElementById('f-title').value = '';
      document.getElementById('f-desc').value = '';
      document.getElementById('f-tags').value = '';
      populateColSelect(defaultCol || 'planned');
      title.textContent = 'Add Card';
      submitBtn.textContent = 'Add Card';
    }

    overlay.classList.remove('hidden');
    document.getElementById('f-title').focus();
  }

  function closeModal() {
    document.getElementById('overlay').classList.add('hidden');
    editId = null;
  }

  document.getElementById('card-form').addEventListener('submit', e => {
    e.preventDefault();
    const title = document.getElementById('f-title').value.trim();
    if (!title) return;

    const desc = document.getElementById('f-desc').value.trim();
    const rawTags = document.getElementById('f-tags').value;
    const tags = rawTags.split(',').map(t => t.trim()).filter(Boolean);
    const col = document.getElementById('f-col').value;

    if (editId) {
      const card = cards.find(c => c.id === editId);
      if (card) { card.title = title; card.desc = desc; card.tags = tags; card.col = col; }
    } else {
      cards.push({ id: uid(), title, desc, tags, col, createdAt: Date.now() });
    }

    saveCards();
    closeModal();
    renderBoard();
  });

  document.getElementById('modal-cancel').addEventListener('click', closeModal);

  document.getElementById('overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('overlay')) closeModal();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  // ── Search ──────────────────────────────────────────────────

  document.getElementById('search').addEventListener('input', renderBoard);

  // ── Utils ───────────────────────────────────────────────────

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Init ────────────────────────────────────────────────────

  renderBoard();
</script>
</body>
</html>
